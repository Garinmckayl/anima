name: ani

on:
  push:
    branches: [main]
    paths: ["ani/**", ".github/workflows/ani.yml"]
  pull_request:
    paths: ["ani/**", ".github/workflows/ani.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ani-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate, patch and play the .ani examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ani
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ani/package-lock.json

      - run: npm ci

      - run: npm test
